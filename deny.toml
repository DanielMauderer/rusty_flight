# cargo-deny configuration — supply-chain hygiene for the dependency tree.
# Run locally with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Fail on any crate with an open RUSTSEC advisory.
version = 2
yanked = "deny"
# Add RUSTSEC IDs here to accept a known issue that has no available fix.
ignore = [
    # `bare-metal` 1.0.0 is deprecated/unmaintained. Pulled in transitively by
    # stm32f7xx-hal 0.8 (via stm32f7); no safe upgrade is available until the
    # HAL drops it. Revisit when bumping stm32f7xx-hal.
    "RUSTSEC-2026-0110",
]

[licenses]
version = 2
# This project is dual-licensed Apache-2.0 / MIT; allow the common permissive
# licenses found in the embedded ecosystem. Tighten/loosen as needed.
# Only the licenses actually present in the dependency tree are listed, to keep
# `license-not-encountered` warnings out of CI. Add more here as deps change.
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]
# Confidence threshold for detecting a license from its text (0.0 - 1.0).
confidence-threshold = 0.8

[bans]
# Warn when multiple versions of the same crate are pulled in (bloat risk on a
# constrained MCU). Set to "deny" once the tree is clean if you want a hard gate.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only allow crates from crates.io by default.
unknown-registry = "deny"
unknown-git = "deny"
